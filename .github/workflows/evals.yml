name: evals

on:
  pull_request:
    paths:
      - "apps/api/breach/judge/**"
      - "apps/api/breach/narrator/**"
      - "apps/api/breach/retrieval/**"
      - "apps/api/breach/security/**"
      - "apps/api/breach/llm.py"
      - "data/attack/**"
      - "evals/**"

jobs:
  evals:
    # Self-hosted so the gate calls a real local LLM (Ollama + Qwen3) for
    # measurable judge quality, at no per-run API cost. See evals/README.md.
    runs-on: [self-hosted, macOS, breach-llm]
    env:
      LLM_PROVIDER: ollama
      EMBEDDING_PROVIDER: test
      # A dedicated port and container name, not docker-compose.yml's own
      # service: this runner is also the dev machine, where that compose
      # project's db already owns 5433. Reusing it would either collide
      # on the port or silently depend on dev-machine state persisting.
      DATABASE_URL: postgresql://breach:breach@localhost:5434/breach
      # Ollama unloads an idle model from memory after a few minutes, so
      # the first real call can be a slow cold load (reading several GB
      # off disk) rather than inference. A longer timeout here, plus the
      # explicit warm-up step below, avoids a false failure from that.
      LLM_TIMEOUT_SECONDS: 120
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: |
          docker rm -f breach-ci-db >/dev/null 2>&1 || true
          docker run -d --name breach-ci-db \
            -e POSTGRES_DB=breach -e POSTGRES_USER=breach -e POSTGRES_PASSWORD=breach \
            -p 5434:5432 pgvector/pgvector:pg16
          for i in $(seq 1 30); do
            docker exec breach-ci-db pg_isready -U breach -d breach && break
            sleep 2
          done

      - name: Ensure the Ollama model is pulled
        run: ollama list | grep -q "${OLLAMA_MODEL:-qwen3:8b}" || ollama pull "${OLLAMA_MODEL:-qwen3:8b}"

      - name: Warm up the model
        run: |
          curl -s http://localhost:11434/api/generate \
            -d "{\"model\": \"${OLLAMA_MODEL:-qwen3:8b}\", \"prompt\": \"hi\", \"stream\": false}" \
            --max-time 110 > /dev/null

      - name: Install breach
        # The runner's default `python3`/`pip` on PATH resolve to an
        # unrelated, broken poetry venv (not this project's), so this
        # builds its own venv from a known-good interpreter rather than
        # trusting PATH.
        run: |
          /opt/homebrew/bin/python3.13 -m venv .venv-ci
          .venv-ci/bin/pip install -e "apps/api[dev]"

      - name: Bootstrap retrieval (migrate + seed + embed)
        run: |
          .venv-ci/bin/python -m breach.retrieval.migrate
          .venv-ci/bin/python -m breach.retrieval.seed
          .venv-ci/bin/python -c "
          from breach.retrieval.embed_mitigations import embed_mitigations
          from breach.retrieval import DeterministicTestEmbedder
          embed_mitigations(provider=DeterministicTestEmbedder())
          "

      - name: Run judge eval
        run: .venv-ci/bin/python -m evals.judge.run_judge_eval
        continue-on-error: true

      - name: Run injection eval
        run: .venv-ci/bin/python -m evals.injection.run_injection_eval
        continue-on-error: true

      - name: Gate on results + comment on the PR
        run: .venv-ci/bin/python evals/ci_gate.py

      - name: Stop Postgres
        if: always()
        run: docker rm -f breach-ci-db >/dev/null 2>&1 || true
