[project]
name = "breach-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pyyaml",
    "psycopg[binary]",
    "pgvector",
    "httpx",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "retrieval: needs a running Postgres+pgvector (docker compose up -d db)",
    "ollama: needs a local Ollama server with the configured model pulled",
]
